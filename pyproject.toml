[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gen"
version = "0.3.0"
description = "Agent Factory — Librarian-powered agent lifecycle manager"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "filelock>=3.13.0",
]

[project.scripts]
agent-gen = "agent_gen.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_gen*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.coverage.run]
source = ["agent_gen"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
