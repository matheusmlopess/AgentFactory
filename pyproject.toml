[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfactory-gen"
version = "0.4.0"
description = "Agent Factory — Librarian-powered agent lifecycle manager"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9.0",
    "filelock>=4.2.1,<5",
]

[project.scripts]
agentfactory-gen = "agent_gen.cli:cli"
agentfactory-api = "agent_gen.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_gen*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16,<0.18", "httpx>=0.27", "mypy==2.4.1"]
# The completeness oracle's API backend (the default subscription backend needs only the claude CLI).
oracle = ["anthropic>=0.40"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "PyJWT>=2.8,<3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",   # registry publish (multipart upload)
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# Live tests call real CLI agents (quota). Run them explicitly with: pytest -m live
addopts = "-m 'not live'"
markers = [
    "integration: end-to-end stress tests that exercise the full CLI lifecycle (slow, deselect with -m 'not integration')",
    "live: tests that invoke real CLI agents (claude/codex/gemini); skipped when CLIs not installed",
]

[tool.coverage.run]
source = ["agent_gen"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
# Typed so far (#191): orchestrate, api, signing. Widen `files` as #189/#190 split librarian.py and cli.py.
python_version = "3.11"
files = ["src/agent_gen/orchestrate", "src/agent_gen/api", "src/agent_gen/signing.py"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
# Explicit rule set (ruff 0.16 defaults written out), so a ruff upgrade can't silently change what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "PERF", "RUF", "FURB",
          "PLR0402", "PLW1510", "S110", "S112", "BLE001"]
ignore = [
    "B008",     # FastAPI's Depends()/Query()/File() defaults are the framework's documented pattern
    "PLW1510",  # subprocess.run without check=: callers inspect returncode and report it themselves
]

[tool.ruff.lint.per-file-ignores]
# Broad excepts in the library are #189's scope (split librarian.py and narrow its exception handling).
# Structural/style findings in the two god modules are fixed as part of their split (#189, #190).
"src/agent_gen/librarian.py" = ["BLE001", "S110", "S112", "SIM102", "SIM105", "SIM118", "PERF102", "PERF401",
                                "PERF403", "B007", "RUF059", "C414", "PIE810"]
"src/agent_gen/cli.py" = ["BLE001", "S110", "S112", "SIM102", "SIM105", "SIM115", "PERF401"]
"src/tests/**" = ["BLE001", "S110", "S112", "RUF012"]
