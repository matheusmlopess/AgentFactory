[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfactory-gen"
version = "0.4.0"
description = "Agent Factory — Librarian-powered agent lifecycle manager"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9.0",
    "filelock>=3.13.0,<4.0",
]

[project.scripts]
agentfactory-gen = "agent_gen.cli:cli"
agentfactory-api = "agent_gen.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_gen*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.15,<0.16", "httpx>=0.27"]
# The completeness oracle's API backend (the default subscription backend needs only the claude CLI).
oracle = ["anthropic>=0.40"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "PyJWT>=2.8,<3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",   # registry publish (multipart upload)
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# Live tests call real CLI agents (quota). Run them explicitly with: pytest -m live
addopts = "-m 'not live'"
markers = [
    "integration: end-to-end stress tests that exercise the full CLI lifecycle (slow, deselect with -m 'not integration')",
    "live: tests that invoke real CLI agents (claude/codex/gemini); skipped when CLIs not installed",
]

[tool.coverage.run]
source = ["agent_gen"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
