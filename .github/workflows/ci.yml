name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/

  test:
    name: Tests + Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest -m "not integration" --cov=agent_gen --cov-report=term-missing --cov-fail-under=80

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration stress tests
        run: pytest -m integration -v --no-cov

  webapp:
    name: Webapp (type-check + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Type-check and build
        working-directory: webapp
        run: npm run build

  harness-doctor:
    name: Harness Health (harness-doctor)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run harness-doctor
        run: bash .ai/scripts/harness-doctor.sh --ci

      - name: Upload harness snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-health-snapshot
          path: .ai/.harness-health.json
