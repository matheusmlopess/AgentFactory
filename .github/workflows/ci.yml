name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.15,<0.16"  # 0.16 changed default rules; bump deliberately

      - name: Run ruff
        run: ruff check src/

  test:
    name: Tests + Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,api]"

      - name: Run tests with coverage
        run: pytest -m "not integration and not live" --cov=agent_gen --cov-report=term-missing --cov-fail-under=80

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,api]"

      - name: Run integration stress tests
        run: pytest -m integration -v --no-cov

  install-smoke:
    name: Install as a tool (pipx)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: pipx install . and check --version against pyproject
        run: |
          pipx install .
          EXPECTED=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ACTUAL=$(agentfactory-gen --version)
          echo "$ACTUAL"
          [ "$ACTUAL" = "agentfactory-gen, version $EXPECTED" ]
          agentfactory-gen --help > /dev/null

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,api]"
      - run: mypy

  openapi-drift:
    name: api/openapi.json matches the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[api]"
      - name: Compare
        env:
          AGENTFACTORY_ENV: test
        run: |
          python - <<'PY'
          import json, sys
          from agent_gen.api.main import app
          committed = json.load(open("api/openapi.json"))
          if committed != app.openapi():
              print("::error::api/openapi.json is stale. Regenerate it:")
              print('  AGENTFACTORY_ENV=test python -c "import json; from agent_gen.api.main import app; '
                    'open(\'api/openapi.json\',\'w\').write(json.dumps(app.openapi(), indent=2) + chr(10))"')
              sys.exit(1)
          print("api/openapi.json is up to date")
          PY

  tests-core:
    name: Tests without the [api] extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Core install must not need FastAPI (API tests skip)
        run: pytest -m "not integration and not live" -q --no-cov

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip
      - run: pip install -e ".[api,oracle]" "pip-audit==2.9.0"
      - run: pip-audit --skip-editable --progress-spinner off

  mvp-walkthrough:
    name: MVP walkthrough (local API)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[api]"

      - name: scripts/e2e-local.sh
        run: bash scripts/e2e-local.sh

  harness-doctor:
    name: Harness Health (harness-doctor)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run harness-doctor
        run: bash .ai/scripts/harness-doctor.sh --ci || [ $? -eq 1 ]

      - name: Upload harness snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-health-snapshot
          path: .ai/.harness-health.json
