name: Issue Priority Report

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  generate-report:
    name: Regenerate priority report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Generate priority report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .ai/scripts/generate-priority-report.py

      - name: Commit updated report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ISSUE-PRIORITY.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: regenerate issue priority report [skip ci]"
          git push
