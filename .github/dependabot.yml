version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Only propose releases that have been public for two weeks.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # ruff minors change the rule set; upgrade deliberately (see #219).
      - dependency-name: ruff
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      python-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
