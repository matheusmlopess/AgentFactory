services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Development stack: allows the example JWT_SECRET and reloads on code changes. Remove for production.
      AGENTFACTORY_ENV: "dev"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:4173"
      API_PUBLIC_URL: "http://localhost:8000"
      PYTHONPATH: "/app/src"            # run the mounted source instead of the installed wheel
    volumes:
      - ./src:/app/src:ro
      - api_data:/data                  # SQLite database + registry ZIPs
    restart: unless-stopped
    command: uvicorn agent_gen.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

volumes:
  api_data:

# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env        # fill in GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, JWT_SECRET
#   docker compose up           # api on port 8000; SQLite + registry ZIPs on the api_data volume
#
# Production: build Dockerfile.api, mount a persistent volume at /data, set JWT_SECRET,
# GITHUB_*, CORS_ORIGINS, WEBAPP_URL and API_PUBLIC_URL (https), and do NOT set AGENTFACTORY_ENV.
#
# For full-stack local dev, run the webapp separately:
#   cd ~/repo/agentfactory/agentfactory-webapp
#   VITE_AGENTFACTORY_API_URL=http://localhost:8000 npm run dev
# ─────────────────────────────────────────────────────────────────────────────
